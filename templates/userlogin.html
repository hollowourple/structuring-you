<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structuring You</title>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+French+Canon:ital@0;1&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background-color:#0a0a0f;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

#particles-js{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:25px;
    width:100%;
}


h1{
    color:white;
    font-family:"Cinzel Decorative", serif;
    font-size:2.6rem;
    text-align:center;
    letter-spacing:3px;
}

form{
   background: #edebe9;
backdrop-filter: blur(8px);
    width:100%;
    max-width:360px;
    padding:25px;
    border-radius:12px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    font-family:"IM Fell French Canon", serif;
}

form p{
    font-size:1.2rem;
    text-align:center;
}

input{
    width:100%;
    height:42px;
    padding:10px;
    border:1px solid #cfcfcf;
    border-radius:6px;
    font-size:1rem;
    font-family:"IM Fell French Canon", serif;
    outline:none;
}

input:focus{
    border-color:#0a0a0f;
}

button{
    width:100%;
    height:42px;
    border:none;
    border-radius:6px;
    background:#0a0a0f;
    color:white;
    font-size:1rem;
    font-family:"IM Fell French Canon", serif;
    cursor:pointer;
    transition:0.3s ease;
}

button:hover{
    transform:scale(1.03);
}

.signup-text{
    font-size:1rem;
    margin-top:5px;
}

@media(max-width:500px){
    h1{
        font-size:1.8rem;
        letter-spacing:2px;
    }

    form{
        padding:20px;
    }
}
</style>
</head>

<body>

<div id="particles-js"></div>

<div class="container">

    <h1>STRUCTURING YOU</h1>

    <form action="" method="post">

        <p>Login</p>
        <input type="text" placeholder="Username" name="username">
        <input type="password" placeholder="Password" name="password">
        <button type="submit" name="action" value="login">Enter the Hall</button>
        <p class="signup-text">New to organizing?</p>
        <button type="submit" name="action" value="signup">Create Account</button>

    </form>
    {% for message in get_flashed_messages() %}
    <p style="color:rgb(188, 9, 9); font-size:20px;">{{ message }}</p>
    {% endfor %}

</div>

<script>
particlesJS("particles-js", {
  particles: {
    number: { value: 120 },
    color: { value: "#ffffff" },
    opacity: {
      value: 0.9,
      random: true,
      anim: {
        enable: true,
        speed: 0.8,
        opacity_min: 0.1,
        sync: false
      }
    },
    size: {
      value: 2,
      random: true
    },
    line_linked: { enable: false },
    move: {
      enable: true,
      speed: 0.3,
      direction: "none",
      random: true,
      straight: false,
      out_mode: "out"
    }
  },
  interactivity: {
    detect_on: "canvas",
    events: {
      onhover: {
        enable: true,
        mode: "grab"
      },
      onclick: {
        enable: true,
        mode: "push"
      }
    },
    modes: {
      grab: {
        distance: 140,
        line_linked: {
          opacity: 0.5
        }
      },
      push: {
        particles_nb: 4
      }
    }
  }
});
</script>

</body>
</html>
